name: Publish Dev NuGet Package

on:
  push:
    branches:
      - create-pre-release
  workflow_dispatch: 

permissions:
  contents: read
  id-token: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Commit geçmişini almak için önemli

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Smart Auto-Incremented Dev Version
        run: |
          PACKAGE_NAME="Testinium.DevicePark"
          
          # NuGet V3 API'den paketin mevcut son sürümünü çek
          LATEST_VERSION=$(curl -s "https://api.nuget.org/v3-flatcontainer/$(echo $PACKAGE_NAME | tr '[:upper:]' '[:lower:]')/index.json" | jq -r '.versions[-1]')
          
          if [ "$LATEST_VERSION" = "null" ] || [ -z "$LATEST_VERSION" ]; then
            BASE_VERSION="1.0.0"
          else
            # Stable sürümün base kısmını al (örn: 1.1.0-beta -> 1.1.0) ve minör versiyonu 1 artır
            CLEAN_VERSION=$(echo $LATEST_VERSION | cut -d'-' -f1)
            MAJOR=$(echo $CLEAN_VERSION | cut -d'.' -f1)
            MINOR=$(echo $CLEAN_VERSION | cut -d'.' -f2)
            NEXT_MINOR=$((MINOR + 1))
            BASE_VERSION="${MAJOR}.${NEXT_MINOR}.0"
          fi

          TIMESTAMP=$(date +'%Y%m%d%H%M')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Örnek Çıktı: Canlıda 1.1.0 varsa -> 1.2.0-dev.202610301420-a1b2c3d
          DEV_VERSION="${BASE_VERSION}-dev.${TIMESTAMP}.${COMMIT_HASH}"
          
          echo "Generated Auto Dev Version: $DEV_VERSION"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            -c Release \
            --no-restore \
            -p:Version="$DEV_VERSION"

      - name: Test
        run: |
          dotnet test \
            -c Release \
            --no-build \
            -p:Version="$DEV_VERSION"

      - name: Pack
        run: |
          dotnet pack \
            -c Release \
            --no-build \
            -o artifacts \
            -p:Version="$DEV_VERSION"

      - name: Login to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push Dev Package to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate