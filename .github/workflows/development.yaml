name: Publish Dev NuGet Package to CodeArtifact

on:
  push:
    branches:
      - dev
  workflow_dispatch: 

permissions:
  contents: read
  id-token: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "213855680807"
      DOMAIN_NAME: device-park
      REPOSITORY_NAME: nuget-store
      NUGET_FEED_URL: https://device-park-213855680807.d.codeartifact.eu-west-1.amazonaws.com/nuget/nuget-store/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_DEV_CA_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_DEV_CA_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to AWS CodeArtifact
        run: |
          # AWS üzerinden CodeArtifact token'ı alıp runner'daki NuGet'e yetki veriyoruz
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${{ env.DOMAIN_NAME }}" \
            --domain-owner "${{ env.AWS_ACCOUNT_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query authorizationToken \
            --output text)

          dotnet nuget add source "${{ env.NUGET_FEED_URL }}" \
            --name "codeartifact" \
            --username "aws" \
            --password "$TOKEN" \
            --store-password-in-clear-text

      - name: Generate Dev Version (v1.0.0-dev.tarih.commit)
        run: |
          BASE_VERSION="1.0.0"
          TIMESTAMP=$(date +'%Y%m%d%H%M')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          DEV_VERSION="${BASE_VERSION}-dev.${TIMESTAMP}.${COMMIT_HASH}"
          
          echo "Generated Dev Version: $DEV_VERSION"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            -c Release \
            --no-restore \
            -p:Version="$DEV_VERSION"

      - name: Test
        run: |
          dotnet test \
            -c Release \
            --no-build \
            -p:Version="$DEV_VERSION"

      - name: Pack
        run: |
          dotnet pack \
            -c Release \
            --no-build \
            -o artifacts \
            -p:Version="$DEV_VERSION"

      - name: Push Dev Package to AWS CodeArtifact
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "${{ env.NUGET_FEED_URL }}" \
            --api-key "aws" \
            --skip-duplicate